 ul{padding-left:17px;margin:0;color:#536273;font-size:11px}.scope-box li{margin:5px 0}.scope-box.not{background:#fbf7f4}.scope-box.in{background:#f7fafc}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px;color:#405163}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd9e1;border-radius:7px;padding:9px 10px;background:white;color:var(--ink);font-size:12px}.field textarea{min-height:70px;resize:vertical}.stage-actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid #edf0f3}.basis-list{display:grid;gap:12px;margin-top:18px}.basis-item{border:1px solid var(--line);border-radius:10px;padding:15px}.basis-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.basis-item h3{font-size:12px;margin:0 0 4px}.basis-item p{font-size:11px;color:var(--muted);margin:0}.choice-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.choice{border:1px solid #d5dde4;background:white;color:#566575;border-radius:7px;padding:6px 11px;font-size:10px;font-weight:700}.choice.selected{border-color:#477da5;background:#edf4f9;color:#24577e}.choice.selected.known{border-color:#9ac7b0;background:var(--green-bg);color:var(--green)}.choice.selected.assumed{border-color:#dfc38f;background:var(--amber-bg);color:var(--amber)}.choice.selected.unknown{border-color:#c4d1dc;background:#eef2f5;color:#506070}.basis-feedback{margin-top:10px;padding:9px 11px;background:#f5f8fa;border-radius:7px;font-size:10px;color:#526274}.register-note{font-size:11px;color:var(--muted);margin-top:10px}.request-list{display:grid;gap:12px;margin-top:17px}.request{border:1px solid var(--line);border-radius:10px;padding:15px}.request h3{font-size:12px;margin:0 0 4px}.request p{font-size:10px;color:var(--muted);margin:0 0 12px}.request .form-row{grid-template-columns:1fr 1.2fr}.request.shared{border-left:3px solid #7 <body><div class="app">
<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">EE</div><div><strong>ENGINEERING WORKSPACE</strong><small>Training simulator · v1.0.0</small></div></div>
<div class="nav-label">Workspace</div><nav class="nav"><button class="active" data-page="overview"><span class="ico">▦</span>Project overview</button><button data-page="assignments"><span class="ico">▤</span>Assignments</button><button data-page="library"><span class="ico">▧</span>Project library</button><button data-page="correspondence"><span class="ico">✉</span>Correspondence</button><button data-page="records"><span class="ico">▣</span>Project records</button></nav>
<div class="nav-label">Current project</div><nav class="nav"><button data-page="project"><span class="ico">⌂</span>Project information</button></nav><div class="sidebar-bottom">MAPLE STREET · MS-001<br>Internal training environment<br><span style="color:#8297aa">All engineering work is preliminary.</span></div></aside>
<div class="workspace"><header class="topbar"><button class="menu-btn" id="menuBtn" aria-label="Open navigation">☰</button><div class="crumb">Projects <span style="padding:0 7px;color:#a5b1bc">/</span><b>Maple Street Professional Office Renovation</b></div><div class="topright"><span class="phase">SCHEMATIC DESIGN</span><div class="avatar">EE</div></div></header><main id="main"></main></div></div><div class="toast" id="toast"></div>
<script>
const KEY='mapleStreetSimulator_v1';
const initial={page:'overview',stage:1,scopeSaved:false,basis:{},basisNotes:{},requests:{code:{owner:'Shared responsibility',timing:'Before beginning Schematic Design work'},mechanical:{owner:'Mechanical Engineer',timing:'Before demand estimate is finalized'},panels:{owner:'Building Owner / Facilities Manager',timing:'Before demand estimate is finalized'},lighting:{owner:'Architect / Lighting Designer',timing:'Before demand estimate is finalized'},tenant:{owner:'Tenant Representative',timing:'Before demand estimate is finalized'}},workNow:['Review available project brief and architectural layout','Build an initial source-traceable load inventory from confirmed information'],waiting:['Confirm existing service capacity','Confirm adopted code basis before code-dependent methods','Obtain preliminary mechanical equipment schedules','Obtain final lighting selections and quantities','Confirm tenant equipment requirements'],submitted:false,scope:{included:['Review available project information and architectural layout','Develop a source-traceable connected-load inventory','Prepare a preliminary demand estimate for senior-engineer review','Identify missing information and issue requests','Document calculation basis, assumptions, and limitations'],excluded:['Prepare construction-ready electrical documents','Declare existing service adequate without verification','Treat unconfirmed equipment or code information as fact']}};
let state=load();function load(){try{return {...structuredClone(initial),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(initial)}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}
function setPage(p){state.page=p;save();render();document.getElementById('sidebar').classList.remove('open')}
function header(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function projectBanner(){return `<section class="project-banner"><div><div class="eyebrow">ACTIVE PROJECT · MS-001</div><h2>Maple Street Professional Office Renovation</h2><p>Existing professional office · Approximately 3,000 ft² · Electrical schematic design</p></div><div class="banner-meta"><div><small>PROJECT PHASE</small><strong>Schematic Design</strong></div><div><small>PROJECT STATUS</small><strong>Preliminary assessment</strong></div></div></section>`}
function assignmentStatus(){return state.submitted?'<span class="status blue">Submitted for review</span>':state.stage===1&&!state.scopeSaved?'<span class="status">In progress</span>':state.stage===3?'<span class="status amber">In progress</span>':'<span class="status">In progress</span>'}
function overview(){return header('PROJECT WORKSPACE','Project overview','Your current project, active work, and items that need attention.')+projectBanner()+`<div class="grid three"><div class="card metric"><small>MY CURRENT ASSIGNMENT</small><strong>Project setup</strong><span>Task 1 · Preliminary electrical assessment</span></div><div class="card metric"><small>WORKFLOW STATE</small><strong>${state.submitted?'Awaiting review':'In progress'}</strong><span>${state.submitted?'Submitted to senior electrical engineer':'Project setup and handoff'}</span></div><div class="card metric"><small>NEXT DELIVERABLE</small><strong>Load inventory</strong><span>Source-traceable connected-load inventory</span></div></div><div class="grid two"><section><div class="section-title"><h2>My work</h2><button class="btn" onclick="setPage('assignments')">Open assignments</button></div><div class="card card-pad"><div class="work-item"><div><strong>Task 1 — Preliminary electrical project setup</strong><small>Establish scope, project basis, and work plan</small></div>${assignmentStatus()}</div><div class="work-item"><div><strong>Task 2 — Preliminary electrical assessment</strong><small>Planned next assignment · uses Task 1 outputs</small></div><span class="status">Not started</span></div><div class="callout">Start with the project setup assignment. You can return to the project library and correspondence at any time.</div><button class="btn primary" onclick="setPage('assignments')">Continue Task 1 →</button></div><div class="section-title"><h2>Items needing attention</h2></div><div class="card card-pad"><div class="work-item"><div><strong>Confirm AHJ and adopted electrical code basis</strong><small>Shared responsibility: Senior Electrical Engineer and Project Manager</small></div><span class="status amber">Open</span></div><div class="work-item"><div><strong>Obtain preliminary mechanical equipment schedules</strong><small>Mechanical Engineer</small></div><span class="status amber">Open</span></div><div class="work-item"><div><strong>Verify existing service capacity</strong><small>Existing panel schedules and load records required</small></div><span class="status">Unknown</span></div></div></section><section><div class="section-title"><h2>Project activity</h2></div><div class="card card-pad activity"><div class="activity-row"><span class="activity-dot"></span><div><strong>Project assigned</strong><p>Senior Electrical Engineer issued the preliminary electrical design setup request.</p><p class="small">Project start</p></div></div><div class="activity-row"><span class="activity-dot"></span><div><strong>Project basis established</strong><p>Approximately 3,000 ft² is identified in the project brief. Field verification remains outstanding.</p></div></div><div class="activity-row"><span class="activity-dot"></span><div><strong>Information dependencies identified</strong><p>Mechanical, lighting, tenant, and existing electrical information will be needed.</p></div></div><div class="activity-row"><span class="activity-dot"></span><div><strong>Senior review</strong><p>${state.submitted?'Task 1 preliminary work plan submitted for review.':'No submission yet.'}</p></div></div></div><div class="section-title"><h2>Project principle</h2></div><div class="card card-pad"><p style="font-size:12px;margin:0;color:#536273">Make the best supported engineering decision with the information available. Record assumptions, identify what could change, and know when to stop and verify.</p></div></section></div>`}
function assignment(){return header('ASSIGNMENT · TASK 1','Preliminary electrical project setup','Organize the electrical work before detailed calculations. Work through the stages and carry your decisions into the preliminary work plan.',`<button class="btn" onclick="setPage('library')">View project library</button>`)+`<div class="assignment-layout"><aside class="card stage-nav"><h3>Task 1 workflow</h3><div class="stage-list">${[1,2,3].map((n)=>`<div class="stage-link ${state.stage===n?'active':''} ${n<state.stage?'done':''}" onclick="goStage(${n})"><span class="stage-num">${n<state.stage?'✓':n}</span><span><strong>${['Understand assignment','Establish project basis','Plan work and handoff'][n-1]}</strong><small>${['Scope and limits','Known · Assumed · Unknown','Requests and next steps'][n-1]}</small></span></div>`).join('')}</div></aside><section class="card assignment-card stage-content">${stageContent()}</section></div>`}
function stageContent(){if(state.stage===1)return stage1();if(state.stage===2)return stage2();return stage3()}
function stage1(){return `<div class="stage-kicker">Stage 1 of 3 · Understand assignment</div><h2>What has been requested?</h2><p class="lead">Read the senior engineer’s message and establish the limits of your first assignment. This is a preliminary setup package—not a detailed design submission.</p><div class="email"><div class="email-head"><span>From</span><strong>Senior Electrical Engineer</strong><span>Subject</span><strong>MS-001 — Preliminary Electrical Design</strong></div><div class="email-body"><p>We’re beginning the electrical design for the Maple Street Professional Office Renovation. I’d like you to take the first pass at organizing the electrical work before we get into detailed calculations.</p><p>Start by reviewing the available project information and architectural layout. Establish what we know, identify what we still need, and put together a practical plan for completing the preliminary electrical assessment.</p><p>You’ll eventually prepare a connected-load inventory and a preliminary demand estimate for my review. We don’t have all the final schedules yet, so use your judgment about what can be started now and what needs further information.</p><p>Please bring me a short, organized project setup package before proceeding too far into the technical work.</p></div></div><div class="section-title"><h2>Project scope card</h2><span class="status blue">Preliminary · For review</span></div><p class="muted small">Use this scope card to keep the assignment boundaries visible while you work.</p><div class="scope-grid"><div class="scope-box in"><h3>Included in this assignment</h3><ul>${state.scope.included.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="scope-box not"><h3>Not authorized / not established</h3><ul>${state.scope.excluded.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div><div class="callout warning"><b>Professional boundary:</b> The eventual connected-load inventory and demand estimate must remain preliminary, traceable to available sources, and subject to senior-engineer review.</div><div class="field"><label for="scopeNote">Scope note (optional)</label><textarea id="scopeNote" placeholder="Record any clarification you want to carry into your work plan...">${esc(state.scopeNote||'')}</textarea></div><div class="stage-actions"><span class="muted small">Your work is saved in this browser as you progress.</span><button class="btn primary" onclick="saveScopeNext()">Save scope and continue →</button></div>`}
const basisItems=[{id:'area',title:'The project area is approximately 3,000 ft².',detail:'The project brief identifies an approximate area. It has not been field-verified.',correct:'known',feedback:'Known — the project brief is a source. Preserve the “approximately” qualifier and note that field verification has not occurred.'},{id:'service',title:'The existing electrical service has enough capacity for the renovated office.',detail:'No supporting service records or load verification have been established.',correct:'unknown',feedback:'Unknown — do not assume the service is adequate. Obtain existing panel schedules/load records and verify capacity before making a conclusion.'},{id:'code',title:'The applicable NEC edition and local amendments are established.',detail:'The AHJ and adopted code basis have not yet been confirmed.',correct:'unknown',feedback:'Unknown — confirm the jurisdiction, adopted edition, and amendments before using code-dependent methods. Do not guess the edition.'},{id:'lighting',title:'Final light fixture selections and quantities have been provided.',detail:'Final lighting information is pending. A planning placeholder is not a confirmed selection.',correct:'unknown',feedback:'Unknown — final fixture selections and quantities are still pending. If a temporary placeholder is used for planning, label it clearly as an assumption.'}];
function stage2(){let count=basisItems.filter(x=>state.basis[x.id]).length;return `<div class="stage-kicker">Stage 2 of 3 · Establish project basis</div><h2>Separate facts from uncertainty</h2><p class="lead">Classify each statement using the information currently available. A reasonable assumption is not a fact; an unknown should have a next action.</p><div class="callout">Record the source, impact, and next action in the project basis register. These classifications will carry into the preliminary work plan.</div><div class="basis-list">${basisItems.map(item=>{let v=state.basis[item.id];return `<article class="basis-item"><div class="basis-top"><div><h3>${item.title}</h3><p>${item.detail}</p></div>${v?`<span class="status ${v==='known'?'green':v==='assumed'?'amber':''}">${v[0].toUpperCase()+v.slice(1)}</span>`:'<span class="status">Unclassified</span>'}</div><div class="choice-row">${['known','assumed','unknown'].map(c=>`<button class="choice ${v===c?'selected '+c:''}" onclick="classify('${item.id}','${c}')">${c==='known'?'Known':c==='assumed'?'Assumed':'Unknown'}</button>`).join('')}</div>${v?`<div class="basis-feedback">${basisFeedback(item,v)}</div>`:''}<div class="form-row" style="margin-top:10px"><div class="field" style="margin:0"><label>Source / basis</label><input value="${esc(state.basisNotes[item.id]?.source||defaultSource(item.id))}" onchange="basisNote('${item.id}','source',this.value)" placeholder="Source or reason"></div><div class="field" style="margin:0"><label>Next action / impact</label><input value="${esc(state.basisNotes[item.id]?.action||defaultAction(item.id))}" onchange="basisNote('${item.id}','action',this.value)" placeholder="What should happen next?"></div></div></article>`}).join('')}</div><div class="register-note">${count} of ${basisItems.length} items classified. You can revise a classification at any time.</div><div class="stage-actions"><button class="btn" onclick="goStage(1)">← Back</button><button class="btn primary" onclick="goStage(3)" ${count===0?'disabled':''}>Continue to work plan →</button></div>`}
function basisFeedback(item,choice){if(choice===item.correct)return item.feedback;const correct=item.correct[0].toUpperCase()+item.correct.slice(1);return `Reconsider this classification. Based on the information currently available, this item should be classified as ${correct.toLowerCase()}. ${item.feedback}`}
function defaultSource(id){return {area:'Project brief',service:'Existing panel schedules / load records not yet received',code:'AHJ / project code basis not yet confirmed',lighting:'Final lighting schedule pending from Architect / Lighting Designer'}[id]}
function defaultAction(id){return {area:'Retain approximate qualifier; field verification if needed',service:'Request existing records and verify service capacity',code:'Confirm jurisdiction, adopted edition, and amendments',lighting:'Request final fixture selections and quantities'}[id]}
const reqs=[{id:'code',title:'Confirm AHJ and adopted electrical code basis',desc:'Establish jurisdiction, adopted NEC edition, and applicable local amendments.',owner:['Shared responsibility','Senior Electrical Engineer','Project Manager'],shared:true},{id:'mechanical',title:'Obtain preliminary mechanical equipment schedules',desc:'Request preliminary equipment information and electrical data needed for load inventory.',owner:['Mechanical Engineer','Project Manager']},{id:'panels',title:'Obtain existing panel schedules and load records',desc:'Request available records from the building owner or facilities contact.',owner:['Building Owner / Facilities Manager','Project Manager']},{id:'lighting',title:'Obtain final lighting schedule',desc:'Confirm final fixture selections and quantities from the design team.',owner:['Architect / Lighting Designer','Project Manager']},{id:'tenant',title:'Confirm tenant equipment requirements',desc:'Identify tenant-furnished equipment and any special electrical requirements.',owner:['Tenant Representative','Project Manager']}];
const timing=['Before beginning Schematic Design work','Before demand estimate is finalized','Before senior engineer review'];
function stage3(){let owners={};Object.values(state.requests).forEach(r=>owners[r.owner]=(owners[r.owner]||0)+1);let overloaded=Object.entries(owners).filter(([o,n])=>o!=='Shared responsibility'&&n>1);return `<div class="stage-kicker">Stage 3 of 3 · Plan work and handoff</div><h2>Build a practical work plan</h2><p class="lead">Assign each information request to a responsible role and identify when the information is needed. Requests can share an owner; consider workload and dependencies rather than rejecting a plan automatically.</p><div class="section-title"><h2>Information requests</h2><span class="status blue">5 coordination items</span></div><div class="request-list">${reqs.map(r=>`<article class="request ${r.shared?'shared':''}"><h3>${r.title}</h3><p>${r.desc}</p>${r.shared?'<div class="shared-note">Shared responsibility: the Senior Electrical Engineer establishes the technical code basis; the Project Manager confirms jurisdiction and coordinates with project/AHJ contacts. Both roles are involved.</div>':''}<div class="form-row"><div class="field" style="margin:0"><label>Responsible role</label><select onchange="requestChange('${r.id}','owner',this.value)">${r.owner.map(o=>`<option ${state.requests[r.id].owner===o?'selected':''}>${o}</option>`).join('')}</select></div><div class="field" style="margin:0"><label>Needed by</label><select onchange="requestChange('${r.id}','timing',this.value)">${timing.map(t=>`<option ${state.requests[r.id].timing===t?'selected':''}>${t}</option>`).join('')}</select></div></div></article>`).join('')}</div>${overloaded.length?`<div class="callout warning"><b>Potential coordination bottleneck:</b> ${overloaded.map(([o,n])=>`${esc(o)} has ${n} assigned requests`).join('; ')}. This is not automatically a problem. Consider timing, workload, and whether responsibilities should be redistributed or explicitly managed.</div>`:'<div class="callout">No repeated individual request owners are currently identified. Shared code-basis responsibility remains with both the Senior Electrical Engineer and Project Manager.</div>'}<div class="section-title"><h2>Work sequencing</h2></div><div class="workstreams"><div class="workstream"><h3>Work that can begin now</h3><p>Review available project brief and architectural layout. Build an initial source-traceable connected-load inventory from confirmed information. Record sources and limitations as you go.</p></div><div class="workstream"><h3>Decisions waiting on information</h3><p>Service capacity, code-dependent methods, final lighting quantities, mechanical equipment loads, and tenant equipment requirements must remain open until supported information is received.</p></div></div><div class="field"><label for="planNote">Coordination / sequencing note (optional)</label><textarea id="planNote" onchange="state.planNote=this.value;save()" placeholder="Explain any workload, timing, or dependency decisions...">${esc(state.planNote||'')}</textarea></div><div class="review-box"><h3>Preliminary work plan — submission contents</h3><ul><li>Assignment scope and professional limits</li><li>Known, assumed, and unknown project information, with sources and next actions</li><li>Information requests, responsible roles, and required timing</li><li>Work that can begin now and decisions waiting on information</li><li>Next deliverable: source-traceable connected-load inventory and preliminary demand-estimation approach for senior review</li></ul></div>${state.submitted?'<div class="callout" style="margin-top:15px"><b>Submitted for review.</b> Your preliminary work plan has been recorded as submitted. This prototype does not fabricate senior-engineer review comments or acceptance.</div>':''}<div class="stage-actions"><button class="btn" onclick="goStage(2)">← Back</button><button class="btn primary" onclick="submitPlan()" ${state.submitted?'disabled':''}>Submit preliminary work plan for review</button></div>`}
function library(){let docs=[['PDF','Project brief — Maple Street Professional Office Renovation','Approximate project area, occupancy context, and initial project information.'],['DWG','Architectural layout — Existing office','Available architectural layout for initial room and use review.'],['XLS','Existing electrical records — Pending','Panel schedules and load records have been requested; not yet received.'],['PDF','Preliminary mechanical equipment schedules — Pending','To be provided by the Mechanical Engineer.'],['PDF','Final lighting schedule — Pending','Fixture selections and quantities are not yet confirmed.']];return header('PROJECT INFORMATION','Project library','Reference material available to support the current assignment. Pending items are shown as dependencies, not as received documents.')+`<div class="card card-pad"><div class="section-title" style="margin-top:0"><h2>Reference documents</h2><span class="status">${docs.length} records</span></div><div class="library-grid">${docs.map(d=>`<div class="doc"><div class="doc-icon">${d[0]}</div><div><strong>${d[1]}</strong><p>${d[2]}</p><span class="status ${d[1].includes('Pending')?'amber':'blue'}">${d[1].includes('Pending')?'Requested / pending':'Reference'}</span></div></div>`).join('')}</div><div class="callout">This prototype uses document descriptions and status placeholders. It does not represent actual issued drawings or schedules.</div></div>`}
function correspondence(){return header('PROJECT COMMUNICATION','Correspondence','Project emails, coordination requests, responses, and review comments are collected here. Messages can also appear in context as work progresses.')+`<div class="card card-pad"><div class="work-item"><div><strong>MS-001 — Preliminary Electrical Design</strong><small>From: Senior Electrical Engineer · Initial assignment email</small></div><span class="status blue">Assignment</span></div><div class="work-item"><div><strong>Confirm AHJ and adopted electrical code basis</strong><small>To: Senior Electrical Engineer / Project Manager · Shared responsibility</small></div><span class="status amber">To be issued</span></div><div class="work-item"><div><strong>Preliminary mechanical equipment schedules</strong><small>To: Mechanical Engineer</small></div><span class="status amber">To be issued</span></div><div class="work-item"><div><strong>Existing panel schedules and load records</strong><small>To: Building Owner / Facilities Manager</small></div><span class="status amber">To be issued</span></div><div class="work-item"><div><strong>Final lighting schedule</strong><small>To: Architect / Lighting Designer</small></div><span class="status amber">To be issued</span></div><div class="work-item"><div><strong>Tenant equipment requirements</strong><small>To: Tenant Representative</small></div><span class="status amber">To be issued</span></div><div class="callout">Coordination requests are represented as planned items until the learner submits the work plan. No simulated reply is shown before a project event triggers it.</div></div>`}
function records(){return header('FORMAL PROJECT OUTPUTS','Project records','Accepted calculations, approved assumptions, submitted deliverables, and formal project decisions belong here—not temporary scratch worksheets.')+`<div class="card card-pad"><div class="empty"><div style="font-size:24px;margin-bottom:8px">▣</div><b>No formal project records yet</b><p>When a deliverable is submitted and accepted, the formal record will be retained here.</p></div></div>`}
function project(){return header('PROJECT DETAILS','Maple Street Professional Office Renovation','Project identity and established project framing.')+`<div class="card card-pad"><div class="grid two"><div><div class="eyebrow">PROJECT NUMBER</div><h2 style="font-size:22px">MS-001</h2><p class="muted">Existing professional office renovation</p></div><div><div class="eyebrow">CURRENT PHASE</div><h2 style="font-size:22px">Schematic Design</h2><p class="muted">Preliminary electrical assessment</p></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Project basis</h3><p class="muted" style="font-size:12px">The initial training project is an existing professional office of approximately 3,000 ft². The area is identified in the project brief but is not field-verified. The assignment is to organize preliminary electrical work before all design information is available.</p><div class="callout warning">All outputs are preliminary and for senior-engineer review. Do not imply construction readiness or make unsupported service-capacity or code-compliance conclusions.</div></div>`}
function render(){let m=document.getElementById('main');m.innerHTML=({overview,assignments:assignment,library,correspondence,records,project})[state.page]?.()||overview();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));}
function goStage(n){state.stage=n;state.page='assignments';save();render();window.scrollTo({top:0,behavior:'smooth'})}function classify(id,c){state.basis[id]=c;save();render()}function basisNote(id,k,v){state.basisNotes[id]=state.basisNotes[id]||{};state.basisNotes[id][k]=v;save()}function requestChange(id,k,v){state.requests[id][k]=v;save();render()}function saveScopeNext(){let el=document.getElementById('scopeNote');state.scopeNote=el?.value||'';state.scopeSaved=true;state.stage=2;save();render();toast('Scope saved to your project workspace.')}function submitPlan(){if(basisItems.some(x=>!state.basis[x.id])){toast('Classify each project-basis item before submitting.');return}state.submitted=true;save();render();toast('Preliminary work plan submitted for review.')}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));render();
</script></body></html>
